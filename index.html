<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Matematika Random Seru</title>
    
    <!-- MEMUAT SCRIPT POKI SDK RESMI -->
    <script src="https://poki.com"></script>
    <script>
        PokiSDK.init().then(() => {
            console.log("Poki SDK berhasil aktif!");
            PokiSDK.gameLoadingFinished(); 
        }).catch(() => {
            console.log("Gagal memuat SDK, masuk ke mode offline.");
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #111827 0%, #312e81 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        #game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        #timer { color: #dc2626; }
        #score { color: #2563eb; }
        #lives { color: #dc2626; }
        #question {
            font-size: 2.8rem;
            margin: 20px 0;
            font-weight: bold;
            color: #1f2937;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .btn-option {
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-option:hover {
            background-color: #e5e7eb;
            transform: translateY(-2px);
        }
        .btn-option:active {
            transform: translateY(0);
        }
        #game-over-screen {
            display: none;
        }
        .btn-restart {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-restart:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="play-screen">
            <div class="stats-bar">
                <div id="timer">Waktu: 15s</div>
                <div id="score">Skor: 0</div>
                <div id="lives">Nyawa: ❤️❤️❤️</div>
            </div>
            
            <div id="question">0 + 0 = ?</div>
            
            <div class="options-grid">
                <button class="btn-option" onclick="periksaJawaban(this)">0</button>
                <button class="btn-option" onclick="periksaJawaban(this)">0</button>
                <button class="btn-option" onclick="periksaJawaban(this)">0</button>
                <button class="btn-option" onclick="periksaJawaban(this)">0</button>
            </div>
        </div>

        <div id="game-over-screen">
            <h2>Game Over! 🎮</h2>
            <p style="font-size: 1.2rem;">Skor Akhir Anda:</p>
            <h1 id="final-score" style="color: #2563eb; font-size: 3rem; margin: 10px 0;">0</h1>
            <button class="btn-restart" onclick="mulaiGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        let skor = 0;
        let nyawa = 3;
        let waktu = 15;
        let jawabanBenar = 0;
        let intervalTimer;

        mulaiGame();

        function mulaiGame() {
            skor = 0;
            nyawa = 3;
            document.getElementById('play-screen').style.display = 'block';
            document.getElementById('game-over-screen').style.display = 'none';
            perbaruiStatus();
            buatSoalBaru();
        }

        function buatSoalBaru() {
            waktu = 15;
            document.getElementById('timer').innerText = `Waktu: ${waktu}s`;
            
            clearInterval(intervalTimer);
            intervalTimer = setInterval(() => {
                waktu--;
                document.getElementById('timer').innerText = `Waktu: ${waktu}s`;
                if (waktu <= 0) {
                    clearInterval(intervalTimer);
                    kurangiNyawa();
                }
            }, 1000);

            const listOperator = ['+', '-', '×', '÷'];
            let operator = listOperator[Math.floor(Math.random() * listOperator.length)];

            let angka1, angka2;

            if (operator === '+') {
                angka1 = Math.floor(Math.random() * 30) + 1;
                angka2 = Math.floor(Math.random() * 30) + 1;
                jawabanBenar = angka1 + angka2;
            } 
            else if (operator === '-') {
                angka1 = Math.floor(Math.random() * 30) + 1;
                angka2 = Math.floor(Math.random() * 30) + 1;
                if (angka1 < angka2) {
                    let temp = angka1;
                    angka1 = angka2;
                    angka2 = temp;
                }
                jawabanBenar = angka1 - angka2;
            } 
            else if (operator === '×') {
                angka1 = Math.floor(Math.random() * 10) + 1;
                angka2 = Math.floor(Math.random() * 10) + 1;
                jawabanBenar = angka1 * angka2;
            } 
            else if (operator === '÷') {
                angka2 = Math.floor(Math.random() * 10) + 1;
                jawabanBenar = Math.floor(Math.random() * 10) + 1;
                angka1 = angka2 * jawabanBenar;
            }

            if (typeof PokiSDK !== 'undefined') {
                PokiSDK.gameplayStart();
            }

            document.getElementById('question').innerText = `${angka1} ${operator} ${angka2} = ?`;

            let pilihan = [jawabanBenar];
            while (pilihan.length < 4) {
                let jawabanSalah = jawabanBenar + (Math.floor(Math.random() * 9) - 4); 
                if (jawabanSalah !== jawabanBenar && !pilihan.includes(jawabanSalah) && jawabanSalah >= 0) {
                    pilihan.push(jawabanSalah);
                }
            }

            pilihan.sort(() => Math.random() - 0.5);

            let tombols = document.querySelectorAll('.btn-option');
            for (let i = 0; i < tombols.length; i++) {
                tombols[i].innerText = pilihan[i];
            }
        }

        function periksaJawaban(tombol) {
            let jawabanPemain = parseInt(tombol.innerText);
            
            if (jawabanPemain === jawabanBenar) {
                skor += 10;
                perbaruiStatus();
                buatSoalBaru();
            } else {
                kurangiNyawa();
            }
        }

        function kurangiNyawa() {
            nyawa--;
            perbaruiStatus();
            if (nyawa <= 0) {
                clearInterval(intervalTimer);
                gameOver();
            } else {
                buatSoalBaru();
            }
        }

        function perbaruiStatus() {
            document.getElementById('score').innerText = `Skor: ${skor}`;
            let hati = '';
            for (let i = 0; i < nyawa; i++) {
                hati += '❤️';
            }
            document.getElementById('lives').innerText = `Nyawa: ${hati}`;
        }

        function gameOver() {
            if (typeof PokiSDK !== 'undefined') {
                PokiSDK.gameplayStop();
            }
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'block';
            document.getElementById('final-score').innerText = skor;
        }
    </script>
</body>
</html>
